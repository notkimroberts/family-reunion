<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <!-- https://realfavicongenerator.net -->
        <link rel="icon" type="image/png" href="/will_and_roxie_favicon_32.png" sizes="32x32" />
        <link rel="icon" type="image/png" href="/will_and_roxie_favicon_64.png" sizes="64x64" />
        <!-- The portrait, at the 180px iOS actually asks for, under the root names iOS and link-preview
             fetchers request regardless of this tag. Missing, each request 404s and logs a stack;
             holding anything else (a generic pixel tree once), a saved bookmark shows that instead of
             Will and Roxie. apple-touch-icon-precomposed.png is a copy of the same file. -->
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
        <meta name="apple-mobile-web-app-title" content="Pattersons" />
        <link rel="manifest" href="/site.webmanifest" />
        %sveltekit.head%
    </head>

    <body data-sveltekit-preload-data="hover">
        <div style="display: contents">%sveltekit.body%</div>
    </body>
</html>

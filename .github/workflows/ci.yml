name: CI

on:
    pull_request:
        branches: [main]

jobs:
    ci:
        runs-on: ubuntu-latest
        env:
            FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        steps:
            - uses: actions/checkout@v4
              with:
                  # The spelling check diffs against the base branch, which a shallow clone lacks.
                  fetch-depth: 0

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Lint
              run: bun run lint

            - name: American spelling in added lines
              run: bun scripts/checkAmericanSpelling.ts --base origin/${{ github.base_ref }}

            - name: Type check
              run: bun run check

            - name: Test
              run: bun run test

            - name: Build
              run: bun run build
